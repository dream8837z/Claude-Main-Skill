<title>Munder Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/*XTERM_CSS*/
/* Layout: pixel office floor (scrollable stage) + control panel (side on desktop, below on phone) */
:root {
  --bg: #F3F0F1; --panel: #FFFFFF; --ink: #23191C; --muted: #6B5F63; --line: #E2D8DB;
  --maroon: #6E1423; --gold: #E9C246; --gold-ink: #3F3200; --stage: #2A2530;
  --term: #15111A; --term-ink: #EDE5DE; --t-dim: #9C8F98; --t-ok: #7FD8A2; --t-err: #FF8A80; --t-in: #F4D35E; --t-cmd: #7FB2F0;
  --ok: #2E8B57; --bad: #B3261E;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141015; --panel: #1E171E; --ink: #F1E9E4; --muted: #A6999F; --line: #352A33; --maroon: #A8384A; --gold: #F4D35E; --gold-ink: #2A2000; --stage: #0F0C11; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #141015; --panel: #1E171E; --ink: #F1E9E4; --muted: #A6999F; --line: #352A33; --maroon: #A8384A; --gold: #F4D35E; --gold-ink: #2A2000; --stage: #0F0C11; color-scheme: dark }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.5 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.top { display: flex; align-items: center; gap: 10px; padding: 9px 16px; background: var(--maroon); color: #fff; min-width: 0; }
.brand { font-weight: 700; font-size: 16px; white-space: nowrap; letter-spacing: .2px; }
.brand b { color: var(--gold); }
.chip { font: 600 11.5px var(--mono); padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.14); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.chip::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: #999; vertical-align: 1px; }
.chip[data-st="ready"]::before { background: #7FD8A2; } .chip[data-st="boot"]::before { background: #F4D35E; } .chip[data-st="error"]::before { background: #FF8A80; }
.top .sp { flex: 1; }
.top button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.35); border-radius: 8px; padding: 4px 10px; font-size: 12.5px; white-space: nowrap; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 430px; min-height: 0; }
.stage { background: var(--stage); min-height: 0; min-width: 0; display: flex; flex-direction: column; }
#floorWrap { flex: 1; min-height: 0; overflow: auto; display: grid; place-items: center; }
#floor { display: block; image-rendering: pixelated; }
.roster { display: flex; gap: 6px; padding: 8px 10px; overflow-x: auto; background: rgba(0,0,0,.25); }
.who { flex: none; display: flex; align-items: center; gap: 6px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); color: #F1E9E4; border-radius: 10px; padding: 3px 10px 3px 4px; font-size: 13px; position: relative; }
.who canvas { width: 24px; height: 37px; image-rendering: pixelated; margin-bottom: -6px; align-self: flex-end; }
.who[aria-current="true"] { border-color: var(--gold); background: rgba(244,211,94,.14); }
.who.add { padding: 6px 12px; color: var(--gold); border-style: dashed; }
.who .dot { position: absolute; top: -5px; right: -5px; background: var(--bad); color: #fff; font-size: 10px; border-radius: 9px; padding: 0 5px; line-height: 16px; }
.panel { min-height: 0; min-width: 0; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 10px 0; font-size: 13px; color: var(--muted); position: relative; border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--maroon); }
.tabs b { position: absolute; top: 5px; right: calc(50% - 34px); background: var(--bad); color: #fff; font-size: 10px; border-radius: 9px; padding: 0 5px; line-height: 16px; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.ai-note { margin: 10px 12px 0; padding: 8px 10px; border-radius: 8px; background: var(--line); font-size: 12.5px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 11px; min-height: 34px; font-size: 13px; }
.btn.primary { background: var(--maroon); color: #fff; border-color: var(--maroon); font-weight: 600; }
.btn.ghost { color: var(--muted); }
.btn:disabled { opacity: .5; cursor: default; }
.muted { color: var(--muted); font-size: 12.5px; }
.pill { font: 600 10.5px/1.7 var(--body); padding: 0 7px; border-radius: 6px; background: var(--line); }
.pill.ai { background: var(--gold); color: var(--gold-ink); }
/* agent */
.ahead { display: flex; align-items: flex-end; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.ahead > canvas { width: 36px; height: 56px; image-rendering: pixelated; }
.ainfo { min-width: 0; flex: 1; display: grid; gap: 1px; } .ainfo strong { font-size: 16px; } .ainfo .pill { justify-self: start; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.termbox { flex: 1; min-height: 0; background: var(--term); display: flex; flex-direction: column; }
.xwrap { flex: 1; min-height: 0; position: relative; } .xhost { position: absolute; inset: 6px 4px 4px 8px; }
.keybar { display: flex; gap: 5px; overflow-x: auto; padding: 6px 8px; border-top: 1px solid rgba(255,255,255,.08); }
.keybar button { flex: none; min-width: 38px; min-height: 32px; background: rgba(255,255,255,.07); color: var(--term-ink); border: 1px solid rgba(255,255,255,.14); border-radius: 6px; font: 12.5px var(--mono); }
.alog { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px; font: 12.5px/1.55 var(--mono); color: var(--term-ink); white-space: pre-wrap; word-break: break-word; }
.alog .in { color: var(--t-in); } .alog .cmd { color: var(--t-cmd); } .alog .err { color: var(--t-err); } .alog .ok { color: var(--t-ok); } .alog .sys { color: var(--t-dim); } .alog .ai { color: #fff; margin: 4px 0; }
.aform { display: flex; gap: 8px; padding: 8px 10px; border-top: 1px solid rgba(255,255,255,.08); }
.aform input { flex: 1; min-width: 0; background: transparent; border: 1px solid rgba(255,255,255,.18); border-radius: 8px; padding: 7px 10px; color: var(--term-ink); font-size: 16px; }
.aform button { background: var(--gold); color: var(--gold-ink); border: 0; border-radius: 8px; padding: 0 14px; font-weight: 700; }
/* chat */
#feedScroll { flex: 1; min-height: 0; overflow-y: auto; }
.feed { list-style: none; margin: 0; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 92%; padding: 8px 12px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); align-self: flex-start; min-width: 0; }
.msg.me { align-self: flex-end; background: var(--maroon); border-color: var(--maroon); color: #fff; }
.msg .h { font-size: 11px; opacity: .75; } .msg .b { white-space: pre-wrap; word-break: break-word; }
.msg.thinking .b { color: var(--muted); font-style: italic; }
.composer { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
.composer textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--bg); font-size: 16px; }
/* board */
.board { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; display: grid; gap: 14px; align-content: start; }
.col h3 { margin: 0 0 6px; font-size: 11.5px; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }
.card { padding: 9px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); display: grid; gap: 2px; } .card + .card { margin-top: 6px; }
.card .t { font-weight: 600; } .card.ask { border: 2px solid var(--gold); } .card.ask .q { white-space: pre-wrap; margin: 4px 0 6px; }
.card.ask form { display: flex; gap: 6px; } .card.ask input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--panel); font-size: 16px; }
/* vm */
.vmbar { padding: 10px 12px; display: grid; gap: 4px; border-bottom: 1px solid var(--line); }
.vmbar code { font: 12px var(--mono); }
.credits { margin: 0; padding: 8px 12px; border-top: 1px solid var(--line); } .credits a { color: inherit; }
dialog { border: 0; border-radius: 14px; padding: 0; width: min(420px, calc(100vw - 32px)); background: var(--panel); color: var(--ink); }
dialog::backdrop { background: rgba(10,5,8,.55); }
dialog form, dialog .dlg { padding: 18px; display: grid; gap: 10px; }
dialog h3 { margin: 0; font-size: 17px; }
dialog label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
dialog input, dialog select { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); font-size: 16px; }
dialog .row { display: flex; justify-content: flex-end; gap: 8px; }
.hire-top { display: flex; gap: 12px; align-items: center; } .hire-top canvas { image-rendering: pixelated; }
.err { color: var(--bad); font-size: 13px; min-height: 1em; margin: 0; }
@media (max-width: 900px) {
  .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 46%) minmax(0, 1fr); }
  .panel { border-left: 0; border-top: 1px solid var(--line); }
  #floorWrap { place-items: start; }
  .top .chip { max-width: 40vw; }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">Munder <b>Office</b></div>
    <span class="chip" id="vmChip" data-st="off">VM 꺼짐</span>
    <span class="sp"></span>
    <button type="button" id="resetBtn">초기화</button>
  </header>
  <div class="main">
    <section class="stage" aria-label="오피스 플로어">
      <div id="floorWrap"><canvas id="floor" aria-label="오피스 플로어. 에이전트나 서버 랙을 누르면 열립니다."></canvas></div>
      <div class="roster" id="roster"></div>
    </section>
    <section class="panel" id="panel">
      <nav class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="michael">Michael<b id="chatBadge" hidden></b></button>
        <button type="button" role="tab" data-tab="agent">에이전트</button>
        <button type="button" role="tab" data-tab="board">보드<b id="boardBadge" hidden></b></button>
        <button type="button" role="tab" data-tab="vm">VM</button>
      </nav>

      <div class="view" data-view="michael">
        <p class="ai-note" hidden></p>
        <div id="feedScroll"><ul class="feed" id="feed"></ul></div>
        <form class="composer" id="chatForm">
          <textarea id="chatIn" rows="2" placeholder="Michael에게 지시하기 (Enter 전송)" enterkeyhint="send"></textarea>
          <button class="btn primary" type="submit" id="chatSend">보내기</button>
        </form>
      </div>

      <div class="view" data-view="agent" hidden>
        <div class="ahead" id="agentHead"></div>
        <div class="termbox" id="aiBody">
          <p class="ai-note" hidden></p>
          <div class="alog" id="aiLog" aria-live="polite"></div>
          <form class="aform" id="aiForm" autocomplete="off"><input id="aiIn" placeholder="할 일을 문장으로 입력" enterkeyhint="send"><button type="submit" id="aiSend">실행</button></form>
        </div>
        <div class="termbox" id="shellBody" hidden>
          <div class="xwrap" id="shellHost"></div>
          <div class="keybar" id="keybar"></div>
        </div>
      </div>

      <div class="view" data-view="board" hidden><div class="board" id="board"></div></div>

      <div class="view" data-view="vm" hidden>
        <div class="vmbar"><strong>오피스 VM</strong><span class="muted" id="vmStatus"></span><span class="muted" id="vmProgWrap" hidden>내려받기 <code id="vmProg">0%</code></span></div>
        <div class="termbox"><div class="xwrap" id="vmHost"></div></div>
        <p class="muted credits">VM: <a href="https://github.com/copy/v86" target="_blank" rel="noopener">v86</a> (BSD-2) · Linux 6.6 · BusyBox 1.36.1 (GPL-2.0, 빌드 설정과 소스 출처: <a href="https://github.com/dream8837z/Claude-Main-Skill/tree/feat/munder-mobile/munder-mobile/vm" target="_blank" rel="noopener">munder-mobile/vm</a>) · 캐릭터: <a href="https://github.com/HarnessMD/munder-difflin" target="_blank" rel="noopener">Munder Difflin</a> (MIT)</p>
      </div>
    </section>
  </div>
</div>

<dialog id="hireDlg">
  <form id="hireForm">
    <h3>에이전트 고용</h3>
    <div class="hire-top"><span id="hPortrait"></span>
      <label for="hCast" style="flex:1">캐릭터<select id="hCast"></select></label></div>
    <label for="hEngine">엔진<select id="hEngine"><option value="ai">Claude 에이전트 (VM에서 명령 실행)</option><option value="shell">VM 터미널</option></select></label>
    <label for="hRole">역할<input id="hRole" maxlength="80" placeholder="예: 데이터 정리 담당"></label>
    <p class="err" id="hireErr"></p>
    <div class="row"><button class="btn" type="button" id="hireCancel">취소</button><button class="btn primary" type="submit">출근시키기</button></div>
  </form>
</dialog>
<dialog id="confirmDlg"><div class="dlg"><h3 id="cfTitle"></h3><p id="cfBody" style="margin:0"></p><div class="row"><button class="btn" type="button" id="cfNo">취소</button><button class="btn primary" type="button" id="cfYes">확인</button></div></div></dialog>

<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="vm/libv86.js"></script>
<script src="sprites.js"></script>
<script src="office.js"></script>
<script src="app.js"></script>
